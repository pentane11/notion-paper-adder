name: Build Windows Executable

on:
  push:
    branches: [ main ] # mainブランチにコードが追加されたら自動実行

jobs:
  build:
    runs-on: windows-latest # Windows環境で実行する

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' # 使用するPythonのバージョン

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller requests notion-client PyMuPDF

    - name: Build executable with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "Notion論文追加ツール" GetPapersDatatoNotion_app.py

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: Notion論文追加ツール-exe
        path: dist/Notion論文追加ツール.exe # 完成した.exeファイルの場所
